name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for NuGet trusted publishing (OIDC)
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
          11.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test -c Release --no-build

    - name: Pack (non-release)
      if: github.event_name != 'release'
      run: dotnet pack -c Release --no-restore -o nupkg

    - name: Check package dependencies (non-release)
      if: github.event_name != 'release'
      run: ./.github/check-package-dependencies.sh nupkg

    - name: NuGet login (trusted publishing)
      if: github.event_name == 'release'
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: zcsizmadia

    - name: Pack and push to nuget.org (release)
      if: github.event_name == 'release'
      run: |
        vertag=(${GITHUB_REF//\// })
        VERSION="${vertag[2]}"
        [[ "${VERSION:0:1}" == "v" ]] && VERSION="${VERSION:1}"
        [[ "$VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+(-[a-z0-9]+\.[0-9]+|)$ ]] || (echo "Incorrect version! ($VERSION)"; exit 1)
        dotnet pack -c Release --no-restore -p:PackageVersion="$VERSION" -o nupkg
        ./.github/check-package-dependencies.sh nupkg
        dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  # Publishes tests/Utf8Json.AotSmokeTest with PublishAot=true (trim/AOT warnings are errors) and runs the native executable.
  aot-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
          11.0.x

    - name: Check generated formatters are up to date
      run: |
        dotnet run --project src/Utf8Json.UniversalCodeGenerator -c Release -f net10.0 -- \
          -d tests/Utf8Json.AotSmokeTest/Models -o tests/Utf8Json.AotSmokeTest/Generated/Utf8JsonGenerated.cs -n AotSmoke
        git diff --exit-code --ignore-cr-at-eol -- tests/Utf8Json.AotSmokeTest/Generated \
          || (echo "::error::Generated formatters are stale; regenerate them (see tests/Utf8Json.AotSmokeTest/README.md)"; exit 1)

    - name: Publish (native AOT)
      run: dotnet publish tests/Utf8Json.AotSmokeTest -c Release -r linux-x64 -o aot-out

    - name: Run native executable
      run: ./aot-out/Utf8Json.AotSmokeTest
